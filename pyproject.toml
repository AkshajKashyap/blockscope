[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blockscope"
version = "0.1.0"
description = "Execution-based Ethereum sandwich analysis and counterfactual replay"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ethereum", "evm", "mev", "uniswap", "counterfactual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "web3>=7.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/AkshajKashyap/blockscope"
Issues = "https://github.com/AkshajKashyap/blockscope/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
blockscope = "blockscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
